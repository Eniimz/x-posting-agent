name: eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run eval suite  # agreement floor 70%
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: make eval PYTHON=python
